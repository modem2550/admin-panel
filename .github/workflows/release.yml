name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # === สร้าง .env (แก้ไขแล้ว) ===
      - name: Create .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BNK48_EMAIL=${{ secrets.BNK48_EMAIL }}
          BNK48_PASSWORD=${{ secrets.BNK48_PASSWORD }}
          EOF

      # === แก้ปัญหา Sidecar Binary สำหรับ macOS ===
      - name: Prepare Node Sidecar Binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          echo "📥 Preparing Node sidecar binaries..."

          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            echo "→ macOS Universal build"

            # ดาวน์โหลดทั้งสองสถาปัตยกรรม
            curl -L https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz -o node-arm64.tar.gz
            curl -L https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-x64.tar.gz -o node-x64.tar.gz

            tar -xzf node-arm64.tar.gz
            tar -xzf node-x64.tar.gz

            # สำหรับ universal (สำคัญ)
            lipo -create -output src-tauri/binaries/node-universal-apple-darwin \
              node-v20.18.0-darwin-arm64/bin/node \
              node-v20.18.0-darwin-x64/bin/node

            # สำหรับ build แต่ละ architecture (Tauri มักต้องการ)
            cp node-v20.18.0-darwin-arm64/bin/node src-tauri/binaries/node-aarch64-apple-darwin
            cp node-v20.18.0-darwin-x64/bin/node src-tauri/binaries/node-x86_64-apple-darwin

            chmod +x src-tauri/binaries/node-*

          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            echo "→ Windows build"
            curl -L https://nodejs.org/dist/v20.18.0/node-v20.18.0-win-x64.zip -o node-win.zip
            unzip -q node-win.zip
            cp node-v20.18.0-win-x64/node.exe src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
            chmod +x src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
          fi

          echo "✅ Done! Files in binaries folder:"
          ls -la src-tauri/binaries/

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets below to download."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
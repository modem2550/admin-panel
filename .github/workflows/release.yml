name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # === สร้าง .env (แก้ไขแล้ว) ===
      - name: Create .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BNK48_EMAIL=${{ secrets.BNK48_EMAIL }}
          BNK48_PASSWORD=${{ secrets.BNK48_PASSWORD }}
          EOF

      # === แก้ปัญหา Sidecar Binary สำหรับ macOS ===
      - name: Prepare Node Sidecar Binaries (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          
          echo "Downloading Node binaries for universal build..."
          
          # ดาวน์โหลดและแตกไฟล์สำหรับ Apple Silicon (aarch64)
          curl -L https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz -o node-arm64.tar.gz
          tar -xzf node-arm64.tar.gz
          cp node-v20.18.0-darwin-arm64/bin/node src-tauri/binaries/node-aarch64-apple-darwin
          
          # ดาวน์โหลดและแตกไฟล์สำหรับ Intel (x86_64)
          curl -L https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-x64.tar.gz -o node-x64.tar.gz
          tar -xzf node-x64.tar.gz
          cp node-v20.18.0-darwin-x64/bin/node src-tauri/binaries/node-x86_64-apple-darwin
          
          chmod +x src-tauri/binaries/node-*

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets below to download."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

# 🌟 แก้ไข: อัปเดตเวอร์ชัน SQL ให้รองรับและแมตช์กับฝั่ง npm (ใช้ ~2.4 หรือเปลี่ยนเป็น "2" เพื่อให้ดึงตัวล่าสุดในสาย v2)
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# 🌟 เพิ่มเติม: ใส่ปลั๊กอิน Shell เข้ามาเพื่อให้โค้ดใน lib.rs เรียกใช้งาน Sidecar Node.js ได้
tauri-plugin-shell = "2"
url = "2.5.8"
